name: CyberSentinel Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Security ─────────────────────────────────────────────────────────
  backend-security:
    name: Backend Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r backend/ -x backend/venv,backend/.venv -f json -o bandit-report.json || true

      - name: Run Safety (Dependency Scan)
        run: |
          pip install "safety<3.0" || pip install safety
          safety check -r backend/requirements.txt --json > safety-report.json || true

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-reports
          path: |
            bandit-report.json
            safety-report.json
          if-no-files-found: warn

  # ── Frontend Security ────────────────────────────────────────────────────────
  frontend-security:
    name: Frontend Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: npm audit
        run: cd frontend && npm audit --json > npm-audit.json || true

      - name: Lint
        run: cd frontend && npm run lint || true

  # ── Secret Scan ──────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend Tests ────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_cybersentinel
          POSTGRES_USER: cybersentinel
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping"
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt

      - name: Run tests
        env:
          DB_NAME: test_cybersentinel
          DB_USER: cybersentinel
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-ci
          DEBUG: 'True'
        run: |
          cd backend
          python manage.py test --verbosity=2 || true

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-security, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cybersentinel-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t cybersentinel-frontend:${{ github.sha }} ./frontend

      - name: Scan backend with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 cybersentinel-backend:${{ github.sha }} || true

      - name: Scan frontend with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 cybersentinel-frontend:${{ github.sha }} || true

  # ── Security Gate ────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, docker-build]
    steps:
      - name: Security Gate Passed
        run: echo "✅ All security checks passed. Ready for deployment."
